<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Boxing lab</title>
<style>
/* THE BOXING GIF, in code. Two fighters made only of clothes: wide trousers, a knit band or a shirt and tie, shoes,
   and two fists that float where hands would be. Every piece is a grey photo scrap with a scissor-cut white edge,
   hinged like a paper puppet: hips bob, feet shuffle, fists jab and the other one rocks back. One rig, drawn five
   ways. Nothing here is an image; every texture is made in code. */
html,body{margin:0;height:100%;background:#000;overflow:hidden;font:500 12px -apple-system,"Helvetica Neue",sans-serif}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none}
.tabs{position:fixed;left:50%;top:16px;transform:translateX(-50%);display:flex;flex-wrap:nowrap;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none;gap:4px;padding:4px;border-radius:999px;background:rgba(30,30,32,.55);z-index:2;
  -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);box-shadow:0 0 0 .5px rgba(255,255,255,.14)}
.tabs button{white-space:nowrap;flex:none;position:relative;z-index:1;font:inherit;color:rgba(255,255,255,.65);background:none;border:0;border-radius:999px;padding:8px 14px;cursor:pointer;transition:color .3s ease}
.tabs button.on{color:#111}
.tabs .pill{position:absolute;top:4px;left:4px;height:calc(100% - 8px);border-radius:999px;background:#fff;transition:transform .5s cubic-bezier(.34,1.4,.5,1),width .5s cubic-bezier(.34,1.4,.5,1)}
.hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);color:rgba(255,255,255,.4);font:500 11px ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.28em;text-transform:uppercase;pointer-events:none;z-index:2;transition:color .4s ease}
body.light{background:#fff}
body.light .hint{color:rgba(20,20,20,.45)}
html.locked .tabs,html.locked .hint{display:none}
</style></head><body>
<canvas id="c"></canvas>
<div class="tabs" id="tabs"><span class="pill" id="pill"></span></div>
<div class="hint" id="hint"></div>
<script src="rig.js"></script>
<script>
const STYLES=[
  {id:'collage', name:'01 Collage',     hint:'cut from photographs',      fps:25, light:false},
  {id:'halftone',name:'02 Halftone',    hint:'printed on newsprint',      fps:12.5,light:true},
  {id:'riso',    name:'03 Riso',        hint:'two plates, out of register',fps:12.5,light:true},
  {id:'stop',    name:'04 Stop-motion', hint:'moved by hand, frame by frame',fps:10, light:true},
  {id:'spar',    name:'05 Spar',        hint:'when it is your turn, click as fast as you can', fps:30, light:true},
  {id:'dream',   name:'06 Dream',       hint:'after the out of office footer', fps:25, light:true},
  {id:'nocturne',name:'07 Nocturne',    hint:'everything glows',            fps:25, light:false},
  {id:'prism',   name:'08 Prism',       hint:'light split through glass',   fps:25, light:true},
  {id:'reeded',  name:'09 Reeded',      hint:'through fluted glass',        fps:25, light:true},
  {id:'frost',   name:'10 Frost',       hint:'wipe the glass clear',        fps:25, light:true},
  {id:'glass',   name:'11 Glass',       hint:'on white, the footer\'s glass: echoes, bloom, a floor that reflects', fps:25, light:true}
];
let MODE=0;
/* LOCKED: just the two fighters on white, through the Out of Office footer's glass, trading punches, nothing else on screen. ?all brings back every tab and the game. */
const LOCKED=!new URLSearchParams(location.search).has('all');
if(LOCKED) document.documentElement.classList.add('locked');

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const SC=document.createElement('canvas'), sx=SC.getContext('2d');   /* the scene, drawn once a frame, then printed */
let CW=0,CH=0,DPR=1,K=1,OX=0,OY=0;
const E=document.createElement('canvas'), ex=E.getContext('2d'), TT=document.createElement('canvas'), tt=TT.getContext('2d');
const BUF=document.createElement('canvas'), bx=BUF.getContext('2d'), CLR=document.createElement('canvas'), clx=CLR.getContext('2d'), MK=document.createElement('canvas'), mk=MK.getContext('2d');
function size(){ DPR=Math.min(2,devicePixelRatio||1); CW=innerWidth; CH=innerHeight; cv.width=CW*DPR; cv.height=CH*DPR;
  K=Math.min(CW/DW,CH/DH)*.92; OX=(CW-DW*K)/2; OY=(CH-DH*K)/2+10;
  SC.width=Math.round(DW*K*DPR); SC.height=Math.round(DH*K*DPR);
  for(const c of [E,TT]){ c.width=SC.width; c.height=SC.height; } for(const c of [BUF,CLR,MK]){ c.width=cv.width; c.height=cv.height; } }
size(); addEventListener('resize',size);

function auto(t){
  const spar=STYLES[MODE].id==='spar'&&!LOCKED;
  if(spar){ game(t); EV=EV.filter(e=>t-e.t0<1.3); return; }
  if(t>=nextAuto){ const who=spar?1:(Math.random()<.5?0:1), hand=Math.random()<.62?0:1;
    punch(who,hand,t); if(!spar&&Math.random()<.35) punch(who,1-hand,t+.22);         /* now and then a one-two */
    nextAuto=t+(spar?1.6+Math.random()*1.4:.5+Math.random()*.55); }
  EV=EV.filter(e=>t-e.t0<1.3);
}

function scene(g,t,bg){
  g.setTransform(SC.width/DW,0,0,SC.height/DH,0,0);
  if(bg) { g.fillStyle=bg; g.fillRect(0,0,DW,DH); } else g.clearRect(0,0,DW,DH);
  fighter(g,0,t,292); fighter(g,1,t,508);
}

/* ---- PRINTING: halftone dots, two riso plates ---- */
const SM=document.createElement('canvas'), smx=SM.getContext('2d',{willReadFrequently:true});
function lum(cell){ const cols=Math.ceil(SC.width/cell), rows=Math.ceil(SC.height/cell); SM.width=cols; SM.height=rows;
  smx.drawImage(SC,0,0,cols,rows); const d=smx.getImageData(0,0,cols,rows).data, L=new Float32Array(cols*rows);
  for(let i=0;i<L.length;i++){ const a=d[i*4+3]/255; L[i]=1-(1-(d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11)/255)*a; } return {L,cols,rows}; }
function dots(g,{L,cols,rows},cell,ink,gamma,max,ox,oy,ang){
  g.fillStyle=ink; g.beginPath();
  const ca=Math.cos(ang), sa=Math.sin(ang);
  for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){ const v=Math.pow(1-L[j*cols+i],gamma); if(v<.04) continue;
    const r=cell*.5*max*Math.sqrt(v), cx=(i+.5)*cell, cy=(j+.5)*cell, x=cx+ox+(cy-SC.height/2)*sa*.0, y=cy+oy;
    g.moveTo(x+r,y); g.arc(x,y,r,0,7); }
  g.fill();
}

/* ---- THE LOOP ---- */
let t0=performance.now(), lastTick=-1, shake=0, flash=null;
function frame(now){
  requestAnimationFrame(frame);
  const st=STYLES[MODE], fps=st.fps, tick=Math.floor((now-t0)/1000*fps); if(tick===lastTick) return; lastTick=tick;
  const t=tick/fps; auto(t); JR=rng(tick*977+MODE);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  const place=()=>{ ctx.save(); let dx=0,dy=0; if(shake>0){ dx=(Math.random()-.5)*shake; dy=(Math.random()-.5)*shake; shake*=.75; } ctx.translate(OX+dx,OY+dy); ctx.scale(K/DPR*DPR/DPR,K/DPR*DPR/DPR); };
  const put=(src,filter)=>{ ctx.save(); if(filter) ctx.filter=filter; ctx.drawImage(src,OX,OY,DW*K,DH*K); ctx.restore(); };
  if(st.id==='collage'){
    BOIL=.6; EDGE=LOCKED?0:4.5; EDGECOL='#f2f2f2'; SHADOWS=false;
    ctx.fillStyle='#000'; ctx.fillRect(0,0,CW,CH);
    scene(sx,t,'#000');
    let dx=0,dy=0; if(shake>.3){ dx=(Math.random()-.5)*shake; dy=(Math.random()-.5)*shake; shake*=.72; }
    ctx.save(); ctx.translate(dx,dy); put(SC); ctx.restore();
    /* film: a fine grain over everything, and a flicker of exposure */
    ctx.save(); ctx.globalAlpha=.05+Math.random()*.03; for(let i=0;i<220;i++){ ctx.fillStyle=Math.random()<.5?'#fff':'#000'; ctx.fillRect(Math.random()*CW,Math.random()*CH,1.5,1.5); } ctx.restore();
    if(st.id==='spar'){
      /* a contact flash where a fist lands, and the tally */
      if(flash&&t-flash.t<.18){ const k=(t-flash.t)/.18, x=OX+flash.x*K, y=OY+flash.y*K; ctx.save(); ctx.strokeStyle=`rgba(255,255,255,${1-k})`; ctx.lineWidth=3;
        for(let i=0;i<10;i++){ const a=i/10*6.283, r0=10+k*30, r1=24+k*60; ctx.beginPath(); ctx.moveTo(x+Math.cos(a)*r0,y+Math.sin(a)*r0); ctx.lineTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1); ctx.stroke(); } ctx.restore(); }
      ctx.fillStyle='rgba(255,255,255,.75)'; ctx.font='600 13px ui-monospace,Menlo,monospace'; ctx.fillText(`LANDED ${hits}`,OX+16,OY+28);
    }
  } else if(st.id==='halftone'||st.id==='spar'){
    BOIL=.4; EDGE=0; SHADOWS=false;
    scene(sx,t,'#fff');
    ctx.fillStyle='#ede7da'; ctx.fillRect(0,0,CW,CH);
    const cell=Math.max(4,Math.round(5*DPR)), l=lum(cell);
    let sdx=0,sdy=0; if(shake>.3){ sdx=(Math.random()-.5)*shake; sdy=(Math.random()-.5)*shake; shake*=.7; }
    ctx.save(); ctx.translate(OX+sdx,OY+sdy); ctx.scale(DW*K/SC.width,DH*K/SC.height); dots(ctx,l,cell,'#1c1a17',1.05,1.25,0,0,0); ctx.restore();
    paperGrain('#7a6a50',.05);
    if(st.id==='spar'&&!LOCKED) hud(t);
  } else if(st.id==='riso'){
    BOIL=.5; EDGE=0; SHADOWS=false;
    scene(sx,t,'#fff');
    ctx.fillStyle='#F3F1ED'; ctx.fillRect(0,0,CW,CH);
    const cell=Math.max(4,Math.round(5.5*DPR)), l=lum(cell), R=rng(tick*31);
    ctx.save(); ctx.translate(OX,OY); ctx.scale(DW*K/SC.width,DH*K/SC.height); ctx.globalCompositeOperation='multiply';
    dots(ctx,l,cell,'#A99939',1.5,1.15,(R()-.5)*6*DPR,(R()-.5)*5*DPR,0);       /* gold carries the midtones */
    dots(ctx,l,cell,'#340414',2.2,1.15,(R()-.5)*3*DPR,(R()-.5)*3*DPR,0);     /* oxblood only the darks */
    ctx.restore(); paperGrain('#8a7a60',.05);
  } else if(GLASS[st.id]){
    BOIL=.3; EDGE=0; SHADOWS=false;
    if(st.id==='reeded') reeded(GLASS.reeded,t); else if(st.id==='frost') frost(GLASS.frost,t); else dream(ctx,GLASS[st.id],t);
  } else if(st.id==='stop'){
    BOIL=1.6; EDGE=3.5; EDGECOL='#f6f1e6'; SHADOWS=true;
    ctx.fillStyle=ctx.createPattern(T.craft,'repeat'); ctx.fillRect(0,0,CW,CH);
    /* a soft pool of desk light */
    const gr=ctx.createRadialGradient(CW/2,CH*.45,50,CW/2,CH*.5,Math.max(CW,CH)*.7); gr.addColorStop(0,'rgba(255,240,210,.18)'); gr.addColorStop(1,'rgba(40,20,0,.35)'); ctx.fillStyle=gr; ctx.fillRect(0,0,CW,CH);
    scene(sx,t,null);
    const R=rng(tick*13), dx=(R()-.5)*2, dy=(R()-.5)*2;
    ctx.save(); ctx.translate(dx,dy); put(SC,'sepia(.35) contrast(1.05) brightness(1.02)'); ctx.restore();
  }
}
/* ---- GLASS, after the Out of Office footer's dream: a warm bloom, two colour plates slightly apart, echoes of
   where they just were, grain, and fog in the corners. Then reeded glass, and a frosted pane you wipe. ---- */
const GLASS={
  dream:   {paper:'#ECE9F1',light:'rgba(255,240,224,.55)',glow:'#FFE6D2',echo:'#7A6FA8',A:'#E89B8E',B:'#8FB4E0',dark:false,split:2.2},
  nocturne:{paper:'#171A2B',light:'rgba(120,110,200,.35)',glow:'#8C7EF0',echo:'#6A5FD6',A:'#FF5C8A',B:'#38D6FF',dark:true, split:2.6},
  prism:   {paper:'#F6E7D2',light:'rgba(255,200,140,.6)', glow:'#FFC88C',echo:'#D86A2E',A:'#E9427A',B:'#2BB3C9',dark:false,split:7},
  reeded:  {paper:'#E4EFE8',light:'rgba(255,236,210,.5)', glow:'#FFF1DE',echo:'#8DBBA6',A:'#F5A58C',B:'#5FB8B0',dark:false,split:2},
  frost:   {paper:'#EDEBF2',light:'rgba(255,240,224,.55)',glow:'#FFE6D2',echo:'#9A90C8',A:'#E89B8E',B:'#8FB4E0',dark:false,split:2},
  glass:   {paper:'#FFFFFF',light:'rgba(255,240,224,.45)',glow:'#FFE6D2',echo:'#7A6FA8',A:'#E89B8E',B:'#8FB4E0',dark:false,split:2.2,floor:true,echoes:[[0,.3,-6,-3]]}};   /* one purple silhouette behind them, no lag, sat a little up and left */
function tint(src,col){ tt.setTransform(1,0,0,1,0,0); tt.globalCompositeOperation='source-over'; tt.clearRect(0,0,TT.width,TT.height); tt.drawImage(src,0,0);
  tt.globalCompositeOperation='source-in'; tt.fillStyle=col; tt.fillRect(0,0,TT.width,TT.height); tt.globalCompositeOperation='source-over'; return TT; }
function dream(c,P,t){
  const at=(img,dx=0,dy=0)=>c.drawImage(img,OX+dx,OY+dy,DW*K,DH*K);
  c.fillStyle=P.paper; c.fillRect(0,0,CW,CH);
  const lg=c.createRadialGradient(CW*.5,CH*.38,20,CW*.5,CH*.45,Math.max(CW,CH)*.6); lg.addColorStop(0,P.light); lg.addColorStop(1,'rgba(0,0,0,0)'); c.fillStyle=lg; c.fillRect(0,0,CW,CH);
  /* echoes: where they were a moment ago, oldest first, further back and fainter */
  for(const [ec,a,dx=0,dy=0] of (P.echoes||[[.98,.14],[.6,.22],[.28,.32]])){ scene(ex,t-ec,null); c.save(); c.globalAlpha=a; c.filter='blur(1.5px)'; c.globalCompositeOperation=P.dark?'screen':'multiply'; at(tint(E,P.echo),dx*K,dy*K); c.restore(); }
  scene(sx,t,null);
  /* the bloom, then the two plates that never quite agree, then the fighters themselves */
  c.save(); c.filter='blur(22px)'; c.globalAlpha=P.dark?.75:.6; c.globalCompositeOperation=P.dark?'screen':'source-over'; at(tint(SC,P.glow)); c.restore();
  c.save(); c.globalCompositeOperation=P.dark?'screen':'multiply'; c.globalAlpha=.55; at(tint(SC,P.A),-P.split,0); at(tint(SC,P.B),P.split,P.split*.3); c.restore();
  c.save(); c.globalAlpha=P.dark?.85:.82; if(P.dark) c.filter='brightness(1.25)'; at(SC); c.restore();
  /* the floor: a soft reflection of them, upside down about the ground line, faint, as in the footer */
  if(P.floor){ c.save(); c.globalAlpha=.10; c.filter='blur(6px)'; c.translate(0,2*(OY+GROUND*K)); c.scale(1,-1); at(SC); c.restore(); }
  /* fog in the corners, grain over everything */
  const fg=c.createRadialGradient(CW/2,CH/2,Math.min(CW,CH)*.35,CW/2,CH/2,Math.max(CW,CH)*.75); fg.addColorStop(0,P.paper+'00'); fg.addColorStop(1,P.paper);   /* transparent paper, not transparent black: the gradient would grey the corners */ c.fillStyle=fg; c.fillRect(0,0,CW,CH);
  c.save(); c.globalAlpha=P.dark?.07:.06; for(let i=0;i<900;i++){ c.fillStyle=Math.random()<.5?'#fff':'#000'; c.fillRect(Math.random()*CW,Math.random()*CH,1.3,1.3); } c.restore();
}
/* REEDED: vertical flutes, each a little lens over its own slice of the scene */
function reeded(P,t){
  bx.setTransform(DPR,0,0,DPR,0,0); dream(bx,P,t);
  const w=Math.round(22*DPR), mag=1.28; ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  for(let x=0;x<cv.width;x+=w){ const sw=w/mag, sx0=x+(w-sw)/2+Math.sin(x*.013+t*.4)*2*DPR; ctx.drawImage(BUF,sx0,0,sw,cv.height,x,0,w,cv.height);
    const hg=ctx.createLinearGradient(x,0,x+w,0); hg.addColorStop(0,'rgba(255,255,255,.0)'); hg.addColorStop(.18,'rgba(255,255,255,.28)'); hg.addColorStop(.32,'rgba(255,255,255,.04)'); hg.addColorStop(.85,'rgba(0,30,20,.10)'); hg.addColorStop(1,'rgba(0,30,20,.16)');
    ctx.fillStyle=hg; ctx.fillRect(x,0,w,cv.height); }
  ctx.restore();
}
/* FROST: the pane fogs the fight; the cursor wipes it clear; it slowly fogs over again, and wiped glass drips */
let FM=null, DRIPS=[];
addEventListener('pointermove',e=>{ if(STYLES[MODE].id!=='frost') return; const x=e.clientX*DPR, y=e.clientY*DPR;
  if(FM){ mk.save(); mk.lineCap='round'; mk.lineWidth=70*DPR; mk.strokeStyle='#000'; mk.beginPath(); mk.moveTo(FM[0],FM[1]); mk.lineTo(x,y); mk.stroke(); mk.restore();
    if(Math.random()<.08) DRIPS.push({x:x+(Math.random()-.5)*50*DPR,y:y+30*DPR,v:.4+Math.random()*.8,len:0}); }
  FM=[x,y]; });
addEventListener('pointerleave',()=>{ FM=null; });
function frost(P,t){
  bx.setTransform(DPR,0,0,DPR,0,0); dream(bx,P,t);
  ctx.save(); ctx.setTransform(1,0,0,1,0,0);
  ctx.filter=`blur(${16*DPR}px)`; ctx.drawImage(BUF,0,0); ctx.filter='none';
  ctx.fillStyle='rgba(245,245,250,.42)'; ctx.fillRect(0,0,cv.width,cv.height);
  /* the frost's own crystals */
  ctx.globalAlpha=.06; for(let i=0;i<700;i++){ ctx.fillStyle='#fff'; ctx.fillRect(Math.random()*cv.width,Math.random()*cv.height,2,2); } ctx.globalAlpha=1;
  /* the wiped glass: clear where the mask is, the mask fogging back a little every frame */
  mk.save(); mk.globalCompositeOperation='destination-out'; mk.fillStyle='rgba(0,0,0,.012)'; mk.fillRect(0,0,MK.width,MK.height); mk.restore();
  for(const d of DRIPS){ d.len+=d.v*DPR; mk.save(); mk.strokeStyle='#000'; mk.lineWidth=3*DPR; mk.lineCap='round'; mk.beginPath(); mk.moveTo(d.x,d.y+d.len-d.v*DPR); mk.lineTo(d.x,d.y+d.len); mk.stroke(); mk.restore(); d.v*=.995; }
  DRIPS=DRIPS.filter(d=>d.len<160*DPR&&d.v>.05);
  clx.setTransform(1,0,0,1,0,0); clx.globalCompositeOperation='source-over'; clx.clearRect(0,0,CLR.width,CLR.height); clx.drawImage(MK,0,0);
  clx.globalCompositeOperation='source-in'; clx.drawImage(BUF,0,0); clx.globalCompositeOperation='source-over';
  ctx.drawImage(CLR,0,0);
  ctx.restore();
}

function paperGrain(col,a){ ctx.save(); ctx.globalAlpha=a; ctx.fillStyle=col; for(let i=0;i<500;i++) ctx.fillRect(Math.random()*CW,Math.random()*CH,1.2,1.2); ctx.restore(); }
requestAnimationFrame(frame);

/* SPAR, as a game of chance. A coin decides whose turn it is. Their turn: they throw a flurry and each punch may
   land on you. Your turn: three seconds, and every click is a punch that may land. Someone reaches zero: K.O. */
const G={phase:'start',until:0,you:100,them:100,combo:0,next:0,msg:'',sub:''};
const INTRO=1.1, ACT=3.2;
/* they swing first; after their turn you always get to answer; after yours, a small chance you go again */
function turn(t,mine,bonus){ G.combo=0;
  if(mine){ G.phase='yours'; G.until=t+ACT; G.msg=bonus?'BONUS ROUND':'YOUR TURN'; G.sub='click! click! click!'; document.body.style.cursor='pointer'; }
  else { G.phase='theirsIntro'; G.until=t+INTRO; G.msg='THEIR TURN'; G.sub='hold on'; document.body.style.cursor=''; } }
function game(t){
  if(G.phase==='start'){ G.you=100; G.them=100; turn(t,false); G.until=t+INTRO+.6; return; }
  if(G.phase==='ko') return;
  if(t<G.until){
    if(G.phase==='theirs'&&t>=G.next){ /* their flurry: quick and uneven, each punch a coin toss */
      const lands=Math.random()<.55; punch(1,Math.random()<.6?0:1,t,lands);
      if(lands){ G.you=Math.max(0,G.you-(4+Math.floor(Math.random()*6))); shake=10; burst(1,t); if(G.you<=0) ko(t,false); }
      G.next=t+.24+Math.random()*.3; }
    return; }
  if(G.phase==='theirsIntro'){ G.phase='theirs'; G.until=t+ACT*.8; G.next=t; return; }
  if(G.phase==='theirs'){ turn(t,true,false); return; }
  if(G.phase==='yours'){ const again=Math.random()<.22; turn(t,again,again); return; }
}
function ko(t,won){ document.body.style.cursor='pointer'; G.phase='ko'; G.msg=won?'K.O.  YOU WIN':'K.O.'; G.sub='click for a rematch'; }
function burst(who,t){ const p=pose(who,t), f=p.lead>p.rear?p.L:p.R; flash={t,x:who===0?292+f[0]*FS:508-f[0]*FS,y:GROUND+f[1]*FS}; }
let hand=0;
cv.addEventListener('pointerdown',()=>{
  if(STYLES[MODE].id!=='spar'&&!LOCKED) return;
  const t=lastTick/STYLES[MODE].fps;
  if(LOCKED){ hand=1-hand; punch(0,hand,t,true); shake=6; return; }   /* locked: a click is just a punch */
  if(G.phase==='ko'){ G.phase='start'; return; }
  if(G.phase!=='yours') return;
  hand=1-hand; const lands=Math.random()<.7; punch(0,hand,t,lands);
  if(lands){ G.them=Math.max(0,G.them-(2+Math.floor(Math.random()*3))); G.combo++; shake=7; burst(0,t); if(G.them<=0) ko(t,true); }
});
/* the scorecard, the turn, the flash: all in the same ink as the print */
function hud(t){
  const ink='#1c1a17', x0=OX, w=DW*K, y0=OY+18;
  ctx.save(); ctx.fillStyle=ink; ctx.strokeStyle=ink; ctx.font='700 12px ui-monospace,Menlo,monospace'; ctx.textBaseline='middle';
  const bar=(x,label,v,right)=>{ const bw=w*.3, bx=right?x-bw:x; ctx.textAlign=right?'right':'left'; ctx.fillText(label,right?x:x,y0);
    ctx.lineWidth=1.5; ctx.strokeRect(bx,y0+12,bw,10); const f=bw*v/100; ctx.fillRect(right?bx+bw-f:bx,y0+12,f,10); };
  bar(x0+24,'YOU',G.you,false); bar(x0+w-24,'THEM',G.them,true);
  if(G.phase==='yours'){ const left=Math.max(0,G.until-t), H=DH*K;
    /* the stage frame pulses in ink while it is yours */
    ctx.lineWidth=3+2*Math.abs(Math.sin(t*10)); ctx.strokeRect(OX+6,OY+6,w-12,H-12);
    /* the time you have left, draining under the banner, and what you have landed */
    const bw=w*.34, bx=x0+w/2-bw/2, by=OY+H*.2+56; ctx.lineWidth=1.5; ctx.strokeRect(bx,by,bw,8); ctx.fillRect(bx,by,bw*left/ACT,8);
    ctx.textAlign='center'; ctx.font='700 13px ui-monospace,Menlo,monospace'; ctx.fillText(`${G.combo} LANDED`,x0+w/2,by+24); }
  if(G.msg){ const big=G.phase==='ko'?56:G.phase==='yours'?52:40, pulse=G.phase==='yours'?1+.06*Math.abs(Math.sin(t*9)):1;
    ctx.textAlign='center'; ctx.font=`800 ${big*pulse}px ui-monospace,Menlo,monospace`; ctx.fillText(G.msg,x0+w/2,OY+DH*K*.2);
    if(G.sub){ ctx.font='600 12px ui-monospace,Menlo,monospace'; ctx.fillText(G.sub.toUpperCase().split('').join(' '),x0+w/2,OY+DH*K*.2+(G.phase==='yours'?34:big*.72)); } }
  if(flash&&t-flash.t<.2){ const k=(t-flash.t)/.2, x=OX+flash.x*K, y=OY+flash.y*K; ctx.lineWidth=3; ctx.globalAlpha=1-k;
    for(let i=0;i<12;i++){ const a=i/12*6.283, r0=8+k*26, r1=20+k*54+(i%2)*10; ctx.beginPath(); ctx.moveTo(x+Math.cos(a)*r0,y+Math.sin(a)*r0); ctx.lineTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1); ctx.stroke(); } }
  ctx.restore();
}

/* the tabs */
const tabs=document.getElementById('tabs'), pill=document.getElementById('pill');
STYLES.forEach((s,i)=>{ const b=document.createElement('button'); b.textContent=s.name; b.onclick=()=>setMode(i); tabs.appendChild(b); });
function setMode(i){ MODE=i; const bs=[...tabs.querySelectorAll('button')]; bs.forEach((b,k)=>b.classList.toggle('on',k===i));
  pill.style.transform=`translateX(${bs[i].offsetLeft-4}px)`; pill.style.width=bs[i].offsetWidth+'px';
  document.getElementById('hint').textContent=STYLES[i].hint; if(LOCKED) document.body.style.cursor=''; document.body.classList.toggle('light',STYLES[i].light);
  EV=[]; nextAuto=0; lastTick=-1; G.phase='start'; document.body.style.cursor=''; if(!LOCKED) try{ localStorage.setItem('boxing-mode',i); }catch(e){} }
let m0=0; try{ m0=+localStorage.getItem('boxing-mode')||0; }catch(e){}
if(LOCKED) m0=STYLES.findIndex(s=>s.id==='glass');   /* locked: on white, through the footer's glass */
setMode(Math.min(STYLES.length-1,Math.max(0,m0)));
</script>
