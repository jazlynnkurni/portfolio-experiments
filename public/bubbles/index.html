<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bubbles</title>
<style>
  :root {
    --page:  #FFFFFF;
    --card:  #FFFFFF;
    --ink:   #1D1C1A;
    --dim:   rgba(29,28,26,0.48);
    --line:  rgba(29,28,26,0.14);
    --r-card: 22px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 400 13px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: grid;
    place-items: center;
    padding: 24px;
    overflow: hidden;
    overscroll-behavior: none;
  }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 12px;
    animation: rise 640ms cubic-bezier(0.2,0,0,1) both;
  }

  .well {
    position: relative;
    width: min(calc(100vw - 48px), calc((100svh - 104px) * 0.82), 620px);
    aspect-ratio: 0.82;
    border-radius: var(--r-card);
    overflow: hidden;
    background: var(--card);
    box-shadow:
      0 1px 2px rgba(40,36,30,0.07),
      0 6px 16px rgba(40,36,30,0.07),
      0 22px 48px rgba(40,36,30,0.10);
  }
  /* a hairline on the surface, no border around it */
  .well::after {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    pointer-events: none;
    z-index: 3;
    box-shadow: inset 0 0 0 1px rgba(29,28,26,0.07);
  }

  canvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
    cursor: crosshair;
    z-index: 1;
  }

  .meta {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 0 3px;
    animation: rise 640ms cubic-bezier(0.2,0,0,1) 80ms both;
  }
  .meta h1 { margin: 0; font-size: 13.5px; font-weight: 500; letter-spacing: 0.005em; }
  .meta p  { margin: 0; color: var(--dim); font-size: 11.5px; }
  .meta .sp { flex: 1; }

  #hint {
    position: absolute;
    left: 18px; bottom: 15px;
    z-index: 2;
    pointer-events: none;
    color: rgba(29,28,26,0.42);
    font-size: 11.5px;
    transition: opacity 800ms cubic-bezier(0.2,0,0,1) 300ms;
  }
  #hint.gone { opacity: 0; }

  #toggle {
    width: 25px; height: 25px;
    border: 0; border-radius: 8px;
    background: rgba(29,28,26,0.055);
    color: var(--dim);
    font-size: 11px; line-height: 1;
    cursor: pointer;
    display: grid; place-items: center;
    transition: background 160ms ease, color 160ms ease;
  }
  #toggle:hover { background: rgba(29,28,26,0.11); color: var(--ink); }

  #panel {
    position: absolute;
    right: 2px; bottom: 44px;
    width: 236px;
    max-height: calc(100svh - 160px);
    overflow-y: auto;
    padding: 14px 15px 15px;
    border-radius: 14px;
    background: rgba(255,255,255,0.90);
    backdrop-filter: blur(20px) saturate(1.2);
    -webkit-backdrop-filter: blur(20px) saturate(1.2);
    box-shadow:
      0 1px 2px rgba(40,36,30,0.10),
      0 12px 30px rgba(40,36,30,0.16),
      inset 0 0 0 1px rgba(29,28,26,0.06);
    opacity: 0;
    transform: translateY(6px) scale(0.985);
    transform-origin: 100% 100%;
    pointer-events: none;
    z-index: 4;
    transition: opacity 200ms cubic-bezier(0.2,0,0,1), transform 200ms cubic-bezier(0.2,0,0,1);
  }
  #panel.open { opacity: 1; transform: none; pointer-events: auto; }

  .row { display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; margin-bottom: 8px; }
  .row:last-child { margin-bottom: 1px; }
  .row span { color: var(--dim); font-size: 11px; letter-spacing: 0.015em; }
  .row b { font-weight: 500; font-size: 11px; font-variant-numeric: tabular-nums; }
  .row input { grid-column: 1 / -1; -webkit-appearance: none; appearance: none; width: 100%; height: 15px; background: transparent; cursor: pointer; }
  .row input::-webkit-slider-runnable-track { height: 2px; border-radius: 2px; background: var(--line); }
  .row input::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; margin-top: -4.5px; border-radius: 50%; background: var(--ink); box-shadow: 0 1px 3px rgba(40,36,30,0.3); }
  .row input::-moz-range-track { height: 2px; border-radius: 2px; background: var(--line); }
  .row input::-moz-range-thumb { width: 11px; height: 11px; border: 0; border-radius: 50%; background: var(--ink); }

  #err {
    display: none;
    position: fixed; inset: 24px;
    padding: 18px 20px; overflow: auto;
    border-radius: 12px;
    background: rgba(28,10,10,0.94);
    color: #ffd9d9;
    font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap;
    z-index: 20;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }
  @media (max-width: 560px) { body { padding: 16px; } #panel { width: min(260px, calc(100vw - 40px)); } }
</style>
</head>
<body>
  <figure class="card">
    <div class="well">
      <canvas id="c"></canvas>
      <div id="hint">tap a bubble to burst it</div>
    </div>
    <figcaption class="meta">
      <span class="sp"></span>
      <button id="toggle" title="controls, or press h">&#9881;</button>
    </figcaption>
    <div id="panel"></div>
  </figure>
  <pre id="err"></pre>
  <script type="module" src="./app.js"></script>
</body>
</html>
